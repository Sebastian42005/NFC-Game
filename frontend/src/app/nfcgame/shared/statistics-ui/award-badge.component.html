<article class="group relative overflow-hidden rounded-lg border p-4 ui-shadow-elevated transition duration-200 hover:-translate-y-0.5 hover:ui-surface-hover" [class]="toneClass()">
  <div class="pointer-events-none absolute inset-x-0 top-0 h-px ui-surface-muted opacity-70"></div>
  <p class="text-[11px] font-black uppercase tracking-[0.18em] opacity-80">{{ label() }}</p>
  <h3 class="mt-2 truncate text-lg font-black ui-text-strong">{{ owner() }}</h3>
  <p class="mt-1 text-sm font-bold opacity-90">{{ value() }}</p>
  @if (subLabel()) {
    <p class="mt-2 line-clamp-2 text-xs leading-5 opacity-75">{{ subLabel() }}</p>
  }
</article>

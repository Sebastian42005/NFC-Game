<section class="rounded-lg border ui-border-subtle ui-surface-muted p-5">
  <p class="text-xs font-bold uppercase tracking-[0.16em] ui-text-accent">{{ eyebrow() }}</p>
  <div class="mt-1 flex flex-wrap items-end justify-between gap-3">
    <h2 class="text-xl font-black ui-text-strong">{{ title() }}</h2>
    @if (latest(); as latestPoint) {
      <p class="text-sm font-bold ui-text-warm">{{ latestPoint.value }} Punkte</p>
    }
  </div>
  @if (points().length > 1) {
    <svg class="mt-5 h-56 w-full overflow-visible" viewBox="0 0 320 180" preserveAspectRatio="none" role="img">
      <defs>
        <linearGradient id="nfc-line" x1="0" x2="1" y1="0" y2="0">
          <stop class="line-stop-accent" offset="0%" />
          <stop class="line-stop-info" offset="55%" />
          <stop class="line-stop-warm" offset="100%" />
        </linearGradient>
      </defs>
      <polyline [attr.points]="polyline()" fill="none" stroke="url(#nfc-line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
      @for (point of points(); track point.label + point.x) {
        <circle class="line-point" [attr.cx]="point.x" [attr.cy]="point.y" r="4">
          <title>{{ point.label }} · {{ point.value }} Punkte{{ point.subLabel ? ' · ' + point.subLabel : '' }}</title>
        </circle>
      }
    </svg>
    <div class="mt-3 flex justify-between gap-2 text-xs ui-text-muted">
      <span>{{ data()[0].label }}</span>
      <span>{{ data()[data().length - 1].label }}</span>
    </div>
  } @else {
    <div class="mt-5 rounded-md border border-dashed ui-border-subtle p-6 text-sm ui-text-muted">{{ emptyText() }}</div>
  }
</section>

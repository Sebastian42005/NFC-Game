<article class="relative overflow-hidden rounded-lg border ui-border-subtle ui-surface-muted p-5 shadow-xl">
  <div class="absolute inset-x-0 top-0 h-1" [class]="accentClass()"></div>
  <p class="text-xs font-bold uppercase tracking-[0.16em] ui-text-muted">{{ label() }}</p>
  <strong class="mt-3 block text-4xl font-black tracking-normal ui-text-strong">{{ value() }}</strong>
  @if (subLabel()) {
    <p class="mt-2 text-sm ui-text-soft">{{ subLabel() }}</p>
  }
</article>

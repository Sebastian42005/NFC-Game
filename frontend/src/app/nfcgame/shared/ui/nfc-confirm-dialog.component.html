<div class="rounded-lg border ui-border-subtle ui-bg-nfc p-5 text-ui shadow-2xl">
  <h2 class="text-xl font-semibold tracking-normal ui-text-strong">{{ data.title }}</h2>
  <p class="mt-3 text-sm ui-text-soft">{{ data.message }}</p>
  <div class="mt-6 flex justify-end gap-3">
    <button
      type="button"
      class="rounded-md border ui-border-subtle px-4 py-2.5 text-sm font-medium ui-text-soft transition hover:ui-surface-hover active:scale-[0.99]"
      (click)="close(false)"
    >
      {{ data.cancelText || 'Abbrechen' }}
    </button>
    <button
      type="button"
      class="rounded-md ui-bg-accent px-4 py-2.5 text-sm font-semibold ui-text-on-accent transition hover:ui-bg-accent-soft active:scale-[0.99]"
      (click)="close(true)"
    >
      {{ data.confirmText || 'Bestätigen' }}
    </button>
  </div>
</div>

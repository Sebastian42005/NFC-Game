<div class="nfc-product-stage relative h-svh w-full overflow-hidden">
  <div class="nfc-product-stage-wash absolute inset-0"></div>
  <div #canvasHost class="absolute inset-0"></div>

  <div class="nfc-scroll-cue pointer-events-none absolute bottom-6 right-5 z-10 sm:bottom-8 sm:right-7" aria-hidden="true">
    <span></span>
  </div>

  @if (loadError(); as errorMessage) {
    <div class="absolute bottom-6 left-5 z-30 max-w-sm border border-red-300/24 bg-black/70 p-4 text-sm text-red-100 backdrop-blur">
      {{ errorMessage }}
    </div>
  }
</div>

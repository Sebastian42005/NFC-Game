<div class="flex flex-wrap items-center justify-between gap-3 border-b ui-border-subtle ui-bg-nfc px-4 py-3">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.16em] ui-text-accent">{{ eyebrow() }}</p>
    <h2 class="text-lg font-semibold">{{ title() }}</h2>
  </div>
  <div class="flex flex-wrap gap-2">
    <button class="rounded-md border ui-border-subtle px-3 py-2 text-sm" type="button" (click)="zoomOut.emit()">-</button>
    <button class="rounded-md border ui-border-subtle px-3 py-2 text-sm" type="button" (click)="zoomIn.emit()">+</button>
    <button class="rounded-md border ui-border-subtle px-3 py-2 text-sm" type="button" (click)="validate.emit()">Validieren</button>
    <button class="rounded-md ui-bg-accent px-3 py-2 text-sm font-semibold ui-text-on-accent" type="button" (click)="save.emit()">Speichern</button>
    @if (canRequestPublication()) {
      <button class="rounded-md border ui-border-warm px-3 py-2 text-sm ui-text-warm" type="button" (click)="requestPublication.emit()">Veröffentlichen</button>
    }
  </div>
</div>

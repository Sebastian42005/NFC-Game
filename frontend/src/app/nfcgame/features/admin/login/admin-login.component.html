<main
  class="nfc-game-font nfc-game-shell grid min-h-screen place-items-center px-4 text-ui"
  [class.nfc-theme-dark]="theme() === 'dark'"
  [class.nfc-theme-light]="theme() === 'light'"
>
  <button
    type="button"
    class="fixed right-4 top-4 rounded-md border ui-border-subtle px-3 py-2 text-sm"
    [attr.aria-label]="themeLabel()"
    [attr.title]="themeLabel()"
    (click)="toggleTheme()"
  >
    {{ theme() === 'dark' ? 'Light' : 'Dark' }}
  </button>
  <section class="w-full max-w-md rounded-lg border ui-border-subtle ui-surface-muted p-6">
    <p class="text-xs font-semibold uppercase tracking-[0.16em] ui-text-accent">Account</p>
    <h1 class="mt-2 text-3xl font-semibold">NFC Login</h1>
    <form class="mt-6 grid gap-4" (ngSubmit)="submit()">
      <label class="grid gap-2 text-sm">
        Benutzername
        <input name="username" [ngModel]="username()" (ngModelChange)="username.set($event)" required autocomplete="username" />
      </label>
      <label class="grid gap-2 text-sm">
        Passwort
        <input type="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required autocomplete="current-password" />
      </label>
      @if (error()) {
        <p class="rounded-md border ui-border-accent ui-bg-accent-soft p-3 text-sm ui-text-accent">{{ error() }}</p>
      }
      <button class="rounded-md ui-bg-accent px-4 py-3 font-semibold ui-text-on-accent" type="submit" [disabled]="loading()">
        {{ loading() ? 'Prüfe...' : 'Anmelden' }}
      </button>
    </form>
  </section>
</main>
